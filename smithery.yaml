# Smithery configuration for RobotBase MCP Server
# Hosted (recommended): connect directly to the public endpoint — no local process needed.
# This file also documents how to run the bundled reference implementation against your own nodes.

name: robotbase-mcp
displayName: RobotBase MCP Server
description: >-
  One MCP endpoint for agents: search the live web, read public pages as clean Markdown, and
  verify on-chain data across 10 live chains (BTC/LTC/XMR/ZEC self-hosted; ETH/TRON/Base/
  Polygon/BSC/Solana via managed external RPC). 71 hosted read-only tools: chain verification,
  16 CyberLibrary public-domain book tools and the 17-tool web layer. First 10 calls/day/IP are
  free across every tool and edition; after that x402 USDC on Base or Solana, or an optional
  XMR prepaid key. No write/broadcast tool is exposed. This repo is the dependency-free
  reference implementation (subset); the hosted endpoint is authoritative.
version: 0.35.1
license: MIT
homepage: https://robotbase.cc/mcp
repository: https://github.com/wygogogo19/robotbase-mcp

transport:
  type: streamable-http
  url: https://robotbase.cc/mcp

# Hosted endpoint needs no configuration and takes no API key of any kind.
configSchema:
  type: object
  properties: {}
  additionalProperties: false

# Running the reference implementation locally (bring your own nodes):
startCommand:
  type: stdio
  command: python3
  args:
    - server_editions.py
  env:
    RB_BIND: "127.0.0.1"
    RB_PORT: "8090"
    RB_BTC_RPC_URL: "http://127.0.0.1:8332"
    RB_BTC_RPC_USER: "${config.btcRpcUser}"
    RB_BTC_RPC_PASS: "${config.btcRpcPass}"
    RB_ELECTRS_HOST: "127.0.0.1"
    RB_ZEC_BASE: "http://127.0.0.1:8080"
    RB_HOME_BASE: "http://127.0.0.1:8081"

categories:
  - blockchain
  - data
  - developer-tools

tags:
  - bitcoin
  - ethereum
  - monero
  - zcash
  - tron
  - blockchain-data
  - mempool
  - fees
  - onchain
  - usdt
  - privacy-coins
  - read-only
  - mcp-server
  - web-search
  - web-fetch
  - search
  - fetch
