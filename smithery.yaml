# Smithery configuration for RobotBase MCP Server
# Hosted (recommended): connect directly to the public endpoint — no local process needed.
# This file also documents how to run the bundled reference implementation against your own nodes.

name: robotbase-mcp
displayName: RobotBase MCP Server
description: >-
  Read-only on-chain verification and risk intelligence for Web3 agents, as one MCP endpoint.
  Bitcoin, Ethereum, Monero, Zcash and Tron read from nodes we run ourselves (Tron via a lite
  full node), plus TRON address risk and TRC-20 USDT settlement verification. No API key, no
  account, no subscription — 41 free verification tools and 2 metered risk tools at 0.01 USDC
  per call over x402. No auth, no tracking, no public RPC endpoint. Base and Solana data tools
  were retired on 2026-10-18; x402 still settles in USDC on Base or Solana, as a payment rail
  only.
version: 0.12.6
license: MIT
homepage: https://robotbase.cc/mcp
repository: https://github.com/<your-org>/robotbase-mcp

transport:
  type: streamable-http
  url: https://robotbase.cc/mcp

# Hosted endpoint needs no configuration and takes no API key of any kind.
configSchema:
  type: object
  properties: {}
  additionalProperties: false

# Running the reference implementation locally (bring your own nodes):
startCommand:
  type: stdio
  command: python3
  args:
    - server.py
  env:
    RB_BIND: "127.0.0.1"
    RB_PORT: "8090"
    RB_BTC_RPC_URL: "http://127.0.0.1:8332"
    RB_BTC_RPC_USER: "${config.btcRpcUser}"
    RB_BTC_RPC_PASS: "${config.btcRpcPass}"
    RB_ELECTRS_HOST: "127.0.0.1"
    RB_ZEC_BASE: "http://127.0.0.1:8080"
    RB_HOME_BASE: "http://127.0.0.1:8081"

categories:
  - blockchain
  - data
  - developer-tools

tags:
  - bitcoin
  - ethereum
  - monero
  - zcash
  - tron
  - blockchain-data
  - mempool
  - fees
  - onchain
  - usdt
  - privacy-coins
  - read-only
  - mcp-server
