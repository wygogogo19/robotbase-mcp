# Smithery configuration for RobotBase MCP Server
# Hosted (recommended): connect directly to the public endpoint — no local process needed.
# This file also documents how to run the bundled reference implementation against your own nodes.

name: robotbase-mcp
displayName: RobotBase MCP Server
description: >-
  One MCP endpoint for agents: search the live web, read public pages as clean Markdown, verify
  on-chain payments on Bitcoin/Ethereum/Monero/Zcash/Tron (self-hosted nodes), and pay per call
  over x402 — no API keys, no accounts, no custody. 58 hosted tools: 44 free verification tools,
  2 risk tools, 10 CyberLibrary public-domain book tools and 2 web tools (web_search with
  Serper/Tavily/Brave/cn.bing fallbacks, web_fetch with robots.txt + SSRF guard). This repo is the
  dependency-free reference implementation (45 tools; CyberLibrary is hosted-only). Base and
  Solana are x402 payment rails only — no chain data is served for them.
version: 0.14.0
license: MIT
homepage: https://robotbase.cc/mcp
repository: https://github.com/wygogogo19/robotbase-mcp

transport:
  type: streamable-http
  url: https://robotbase.cc/mcp

# Hosted endpoint needs no configuration and takes no API key of any kind.
configSchema:
  type: object
  properties: {}
  additionalProperties: false

# Running the reference implementation locally (bring your own nodes):
startCommand:
  type: stdio
  command: python3
  args:
    - server.py
  env:
    RB_BIND: "127.0.0.1"
    RB_PORT: "8090"
    RB_BTC_RPC_URL: "http://127.0.0.1:8332"
    RB_BTC_RPC_USER: "${config.btcRpcUser}"
    RB_BTC_RPC_PASS: "${config.btcRpcPass}"
    RB_ELECTRS_HOST: "127.0.0.1"
    RB_ZEC_BASE: "http://127.0.0.1:8080"
    RB_HOME_BASE: "http://127.0.0.1:8081"

categories:
  - blockchain
  - data
  - developer-tools

tags:
  - bitcoin
  - ethereum
  - monero
  - zcash
  - tron
  - blockchain-data
  - mempool
  - fees
  - onchain
  - usdt
  - privacy-coins
  - read-only
  - mcp-server
  - web-search
  - web-fetch
  - search
  - fetch
