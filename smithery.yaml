# Smithery configuration for RobotBase MCP Server
# Hosted (recommended): connect directly to the public endpoint — no local process needed.
# This file also documents how to run the bundled reference implementation against your own nodes.

name: robotbase-mcp
displayName: RobotBase MCP Server
description: >-
  Read-only on-chain verification and risk intelligence for Web3 agents, as one MCP endpoint.
  Bitcoin, Ethereum, Monero, Zcash and Tron read from full nodes we run ourselves, plus TRON
  address risk, TRC-20 USDT settlement verification, Solana token safety and Base contract risk.
  No API key, no account, no subscription — 41 verification tools free, risk tools metered at
  0.01 USDC per call over x402. No auth, no tracking, no public RPC endpoint.
version: 0.12.4
license: MIT
homepage: https://robotbase.cc/mcp
repository: https://github.com/<your-org>/robotbase-mcp

transport:
  type: streamable-http
  url: https://robotbase.cc/mcp

# Hosted endpoint needs no configuration and takes no API key of any kind.
configSchema:
  type: object
  properties: {}
  additionalProperties: false

# Running the reference implementation locally (bring your own nodes):
startCommand:
  type: stdio
  command: python3
  args:
    - server.py
  env:
    RB_BIND: "127.0.0.1"
    RB_PORT: "8090"
    RB_BTC_RPC_URL: "http://127.0.0.1:8332"
    RB_BTC_RPC_USER: "${config.btcRpcUser}"
    RB_BTC_RPC_PASS: "${config.btcRpcPass}"
    RB_ELECTRS_HOST: "127.0.0.1"
    RB_ZEC_BASE: "http://127.0.0.1:8080"
    RB_DOGE_BASE: "http://127.0.0.1:8080"
    RB_LTC_BASE: "http://127.0.0.1:8080"
    RB_RVN_ASSET_BASE: "http://127.0.0.1:18081"
    RB_HOME_BASE: "http://127.0.0.1:8081"

categories:
  - blockchain
  - data
  - developer-tools

tags:
  - bitcoin
  - kaspa
  - zcash
  - ravencoin
  - dogecoin
  - litecoin
  - blockchain-data
  - mempool
  - fees
  - onchain
  - privacy-coins
  - read-only
  - mcp-server
