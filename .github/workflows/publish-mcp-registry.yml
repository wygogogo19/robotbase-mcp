name: Publish to MCP Registry

# Publishes mcp-registry.json to the official MCP Registry using GitHub OIDC, so a
# version bump only needs a commit (or a v* tag) instead of a manual CLI + device flow.
#
# The registry validates namespace ownership: the workflow must run in
# wygogogo19/robotbase-mcp to publish io.github.wygogogo19/robotbase-mcp.

on:
  push:
    branches: [main]
    paths:
      - "mcp-registry.json"
      - ".github/workflows/publish-mcp-registry.yml"
    tags: ["v*"]
  workflow_dispatch:

permissions:
  id-token: write      # required for OIDC authentication
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to the MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Skip if this version is already published
        id: registry
        run: |
          VERSION=$(python3 -c "import json;print(json.load(open('mcp-registry.json'))['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if curl -fsS "https://registry.modelcontextprotocol.io/v0/servers?search=io.github.wygogogo19/robotbase-mcp" \
               | python3 -c "import json,sys;d=json.load(sys.stdin);sys.exit(0 if any(i['server']['version']=='$VERSION' for i in d.get('servers',[])) else 1)"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Already published::$VERSION is already in the MCP Registry — nothing to do."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Publishing::$VERSION is new — will publish."
          fi

      - name: Publish mcp-registry.json
        if: steps.registry.outputs.skip != 'true'
        run: ./mcp-publisher publish mcp-registry.json
