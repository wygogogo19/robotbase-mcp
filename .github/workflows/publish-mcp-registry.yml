name: Publish to MCP Registry

# Publishes the three RobotBase editions to the official MCP Registry using
# GitHub OIDC. Each manifest is a separate server entry:
#   mcp-registry.json         -> io.github.wygogogo19/robotbase-mcp (Web3 alias)
#   mcp-registry-dev.json     -> io.github.wygogogo19/robotbase-dev
#   mcp-registry-content.json -> io.github.wygogogo19/robotbase-content
on:
  push:
    branches: [main]
    paths:
      - "mcp-registry*.json"
      - ".github/workflows/publish-mcp-registry.yml"
    tags: ["v*"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to the MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish each edition
        run: |
          set -euo pipefail
          for f in mcp-registry.json mcp-registry-dev.json mcp-registry-content.json; do
            echo "== $f"
            VERSION=$(python3 -c "import json;print(json.load(open('$f'))['version'])")
            if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
              echo "::notice title=Tag ignored::$GITHUB_REF_NAME does not match $f v$VERSION"
              continue
            fi
            ./mcp-publisher validate "$f"
            OUT=$(./mcp-publisher publish "$f" 2>&1) || true
            printf '%s\n' "$OUT"
            if printf '%s' "$OUT" | grep -qiE 'already (exists|published)|duplicate|conflict'; then
              echo "::notice title=Already published::$f v$VERSION"
              continue
            fi
            printf '%s' "$OUT" | grep -qiE 'published|success' || {
              echo "::error title=Publish failed::$f"
              exit 1
            }
          done
